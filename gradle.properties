# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users: Gradle settings specified in this file
# will override any settings specified in the IDE.

# JVM Arguments for Gradle Daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED

# AndroidX and Jetifier
android.useAndroidX=true
